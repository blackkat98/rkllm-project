# Dev stack for a PC without an NPU (mock engine, hot-reloading backend). Never uses port 80.
#   docker compose -f deploy/compose.dev.yml up --build
#   -> full app on http://localhost:8090 (admin / admin12345)        [WEB_PORT]
#   -> API on http://localhost:8000                                   [BACKEND_PORT]
#   -> or hot-reload UI: cd frontend && npm run dev  (http://localhost:3000, proxies /api to BACKEND_PORT)
name: rkllm-chat-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rkllm
      POSTGRES_USER: rkllm
      POSTGRES_PASSWORD: rkllm
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rkllm -d rkllm"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rkllm:rkllm@db:5432/rkllm
      JWT_SECRET: dev-secret-not-for-production-0123456789
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin12345
      RKLLM_ENGINE: mock
      MOCK_TOKEN_DELAY: "0.03"
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - ./dev-models:/models:ro
    command: ["--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"

  rkllm-web:
    build: ../frontend
    depends_on:
      - backend
    environment:
      WEB_PORT: ${WEB_PORT:-8090}
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${WEB_PORT:-8090}:${WEB_PORT:-8090}"

volumes:
  pgdata-dev:
